<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماركت الكابينة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
        .loading-shimmer { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body>
    <div id="loading-screen" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center">
        <img src="https://alkabeenakrb-coder.github.io/logo.png" class="w-32 h-32 mb-4 animate-pulse" alt="Logo">
        <div class="w-8 h-8 border-4 border-blue-900 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 text-blue-900 font-bold">يا هلا بيك في ماركت الكابينة...</p>
    </div>

    <nav class="bg-blue-900 text-white p-4 sticky top-0 z-40 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">🏠 ماركت الكابينة</h1>
            <div class="relative">
                <button onclick="toggleCart()" class="relative p-2 bg-white/10 rounded-full">
                    🛒 <span id="cart-count" class="absolute -top-1 -right-1 bg-yellow-400 text-blue-900 text-xs font-bold px-1.5 rounded-full">0</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4 pb-24">
        <input type="text" id="searchInput" oninput="render()" placeholder="ابحث عن مادة..." class="w-full p-4 rounded-xl border-2 border-blue-100 mb-6 shadow-sm focus:border-blue-900 outline-none transition-all">
        
        <div id="categories-list" class="flex gap-2 overflow-x-auto pb-4 mb-4 no-scrollbar">
            <button onclick="filterCat('الكل')" class="bg-blue-900 text-white px-6 py-2 rounded-full whitespace-nowrap shadow-md">الكل</button>
        </div>

        <div id="products-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </main>

    <script>
        const API_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS2rL3zO28H-mRz6m9jK5T4W7Q6X0D0W5Y0Z1A2B3C4D5E6F7G8H9I0J/pub?output=csv'; // تأكد من وضع رابط الـ CSV الصحيح هنا
        const APP_ID = '1272a917-26ca-4470-818a-63eede5d3d22';
        const TABLE_NAME = 'إنشاء جدول متجر إلكتروني جاهز';
        
        let allProducts = [];
        let cart = JSON.parse(localStorage.getItem('kabina_cart')) || [];
        let currentCat = 'الكل';

        async function init() {
            try {
                const res = await fetch(API_URL + '&t=' + Date.now());
                const csv = await res.text();
                const lines = csv.split('\n').slice(1);
                const cats = new Set();

                allProducts = lines.map(line => {
                    const parts = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if (parts.length >= 2 && parts[0].trim() !== "") {
                        let c = parts[3] ? parts[3].trim().replace(/"/g, '') : 'عام';
                        if (c && c !== "" && c !== "عام") cats.add(c);

                        const rawImg = parts[2] ? parts[2].replace(/"/g, '').trim() : '';
                        const imageSrc = (rawImg && rawImg.includes('image.')) 
                            ? `https://www.appsheet.com/template/gettablefileurl?appName=${encodeURIComponent(APP_ID)}&tableName=${encodeURIComponent(TABLE_NAME)}&fileName=${encodeURIComponent(rawImg)}` 
                            : (rawImg && rawImg.startsWith('http') ? rawImg : `https://ui-avatars.com/api/?name=${encodeURIComponent(parts[0].replace(/"/g, ''))}&background=facc15&color=1e3a8a`);

                        return {
                            name: parts[0].replace(/"/g, '').trim(),
                            price: parts[1] ? parts[1].replace(/[^0-9]/g, '') : '0',
                            img: imageSrc,
                            cat: c
                        };
                    }
                }).filter(p => p && p.name);

                const catList = document.getElementById('categories-list');
                cats.forEach(cat => {
                    catList.innerHTML += `<button onclick="filterCat('${cat}')" class="bg-white border-2 border-blue-900 text-blue-900 px-6 py-2 rounded-full whitespace-nowrap transition-all hover:bg-blue-900 hover:text-white">${cat}</button>`;
                });

                document.getElementById('loading-screen').style.display = 'none';
                render();
            } catch (e) {
                document.getElementById('loading-screen').innerHTML = "⚠️ فشل في تحميل البيانات، تأكد من رابط الـ CSV.";
            }
        }

        function render() {
            const grid = document.getElementById('products-grid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = allProducts.filter(p => 
                (currentCat === 'الكل' || p.cat === currentCat) &&
                (p.name.toLowerCase().includes(search))
            );

            filtered.forEach(p => {
                grid.innerHTML += `
                    <div class="bg-white rounded-2xl shadow-sm border border-blue-50 overflow-hidden flex items-center p-3 gap-4">
                        <img src="${p.img}" class="w-24 h-24 object-cover rounded-xl bg-gray-100" onerror="this.src='https://via.placeholder.com/150'">
                        <div class="flex-1">
                            <h3 class="font-bold text-gray-800">${p.name}</h3>
                            <p class="text-blue-900 font-bold mt-1">${parseInt(p.price).toLocaleString()} د.ع</p>
                            <button onclick="addToCart('${p.name}')" class="mt-2 w-full bg-blue-50 text-blue-900 py-1.5 rounded-lg font-bold hover:bg-blue-900 hover:text-white transition-colors">+ إضافة</button>
                        </div>
                    </div>
                `;
            });
        }

        function filterCat(cat) {
            currentCat = cat;
            render();
        }

        function addToCart(name) {
            const prod = allProducts.find(p => p.name === name);
            const item = cart.find(i => i.name === name);
            if(item) item.qty++;
            else cart.push({...prod, qty: 1});
            saveCart();
        }

        function saveCart() {
            localStorage.setItem('kabina_cart', JSON.stringify(cart));
            document.getElementById('cart-count').innerText = cart.reduce((a, b) => a + b.qty, 0);
        }

        window.onload = init;
    </script>
</body>
</html>
